[package]
name = "skizzeo-app"
version.workspace = true
edition.workspace = true

[dependencies]
skizzeo-darstellung = { path = "../skizzeo-darstellung" }
skizzeo-editor = { path = "../skizzeo-editor" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Storage", "MediaQueryList", "Navigator", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "CssStyleDeclaration", "PointerEvent", "MouseEvent", "WheelEvent", "Event", "EventTarget", "AddEventListenerOptions", "Performance", "DomRect", "Node"] }
js-sys = "0.3"
